name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Prepare web folder
        run: |
          mkdir -p www
          find . -maxdepth 1 ! -name '.' ! -name '..' ! -name '.git' ! -name '.github' ! -name 'www' -exec cp -r {} www/ \;

      - name: Initialize Capacitor and Android project
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "MyHTMLGame" "com.example.myhtmlgame" --web-dir=www
          npx cap add android

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle' # Now the android folder and gradle files exist, so caching will work correctly

      - name: Make Gradle wrapper executable
        run: |
          cd android
          chmod +x gradlew

      - name: Generate Keystore and Build Signed APK
        run: |
          keytool -genkey -v -keystore "${{ github.workspace }}/release.keystore" -alias gamekey -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=GameDev, OU=Dev, O=Game, L=City, S=State, C=US"
          cd android
          ./gradlew assembleRelease --no-daemon -Pandroid.injected.signing.store.file="${{ github.workspace }}/release.keystore" -Pandroid.injected.signing.store.password=android123 -Pandroid.injected.signing.key.alias=gamekey -Pandroid.injected.signing.key.password=android123

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: android/app/build/outputs/apk/release/app-release.apk
